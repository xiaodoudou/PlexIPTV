name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # 22 is the floor from package.json engines; 26 is what the Docker
        # image and the pkg build targets actually run on.
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # remux.test.js and the fMP4 case in hls.test.js skip themselves when
      # ffmpeg is absent. Installing it means the remux path is actually covered.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm test

  audit:
    name: audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newly published advisory is not a reason to block an unrelated pull
    # request, so this reports without failing the run. Drop this line to make
    # a vulnerable production dependency a hard stop.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
